# =======================================================
# CLAIMIT - Spring Boot Configuration
# =======================================================

server.port=8080

spring.application.name=claimit

# MySQL Database Configuration with Environment Variable Support
# In local development or VS Code:
# Set DB_URL, DB_USERNAME, DB_PASSWORD or configure MySQL locally
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/claimit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# AI Integration Configuration (Optional Gemini API key from environment)
claimit.ai.api-key=${GEMINI_API_KEY:}
claimit.ai.model=gemini-3.8-flash

# Logging
logging.level.com.claimit=INFO
logging.level.org.springframework.web=INFO
